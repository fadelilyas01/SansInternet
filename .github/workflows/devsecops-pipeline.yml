name: DevSecOps CI & Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: read-all

jobs:
  # =========================================================================
  # 1. SCAN ANTI-FUITE DE SECRETS (Gitleaks)
  # =========================================================================
  secret-scan:
    name: 🛡️ Détection de Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan anti-fuite de secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # 2. SCAN DE VULNÉRABILITÉS & DÉPENDANCES (Trivy SCA)
  # =========================================================================
  vulnerability-scan:
    name: 🔍 Scan Vulnérabilités & CVE (Trivy)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Scanner les dépendances et manifests (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  # =========================================================================
  # 3. QUALITÉ & TESTS UNITAIRES FLUTTER / DART
  # =========================================================================
  flutter-tests:
    name: 📱 Flutter Quality & Tests
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Installer les dépendances Pub
        run: flutter pub get

      - name: Analyse statique du code (Lint & Typage)
        run: flutter analyze

      - name: Exécuter la suite de tests avec couverture
        run: flutter test --coverage

      - name: Sauvegarder le rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage-report
          path: coverage/lcov.info
          retention-days: 7

  # =========================================================================
  # 4. SÉCURITÉ & TESTS DU NOYAU CRYPTOGRAPHIQUE RUST
  # =========================================================================
  rust-core-security:
    name: 🦀 Rust Core Security & Tests
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer la toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache des dépendances Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust_core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust_core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Vérifier le formatage du code
        run: cargo fmt --manifest-path rust_core/Cargo.toml -- --check

      - name: Audit de sécurité du code Rust (Clippy)
        run: cargo clippy --manifest-path rust_core/Cargo.toml --all-targets -- -D warnings

      - name: Exécuter les tests cryptographiques (Noise XX + Dalek)
        run: cargo test --manifest-path rust_core/Cargo.toml --verbose

      - name: Audit des CVEs sur les crates Cargo (Cargo-Audit)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          manifest-path: rust_core/Cargo.toml

  # =========================================================================
  # 5. VÉRIFICATION DE COMPILATION DU BUNDLE ANDROID
  # =========================================================================
  android-build-check:
    name: 🤖 Vérification Build Android (APK)
    runs-on: ubuntu-latest
    needs: [flutter-tests, rust-core-security]
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Compiler l'APK Android (Debug Mode)
        run: flutter build apk --debug
