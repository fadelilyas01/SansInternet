name: sans_internet
description: Messagerie instantanée hors-ligne pair-à-pair (P2P / Mesh) avec chiffrement de bout en bout (Noise XX + Ed25519) et stockage SQLCipher.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.9.0
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  image_picker: ^1.2.3
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
